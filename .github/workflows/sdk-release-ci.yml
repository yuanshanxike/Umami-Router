name: SDK Release CI

on:
  push:
    tags:
      - 'v*'
      - 'release*'

permissions:
  contents: write

jobs:
  lint-and-pack-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          git branch --remotes --contains "$GITHUB_SHA" | grep -q 'origin/main'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile

      - name: Sync SDK version from tag
        working-directory: sdk
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          sdk_version="${tag_name#v}"

          if [[ "$tag_name" == release* ]]; then
            sdk_version="${tag_name#release}"
            sdk_version="${sdk_version#-}"
            sdk_version="${sdk_version#/}"
            sdk_version="${sdk_version#v}"
          fi

          if [[ ! "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid SDK version derived from tag: $tag_name"
            exit 1
          fi

          bun pm pkg set "version=$sdk_version"

      - name: Lint SDK
        working-directory: sdk
        run: bun run lint

      - name: Build SDK
        working-directory: sdk
        run: bun run build

      - name: Pack SDK
        working-directory: sdk
        run: bun pm pack

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
